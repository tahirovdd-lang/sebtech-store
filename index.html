<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <title>Sebtech Store</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#0b0b0c;
      --card: rgba(255,255,255,.06);
      --card2: rgba(255,255,255,.08);
      --stroke: rgba(255,255,255,.12);
      --text:#ffffff;
      --muted: rgba(255,255,255,.72);
      --accent:#2f7cff;

      --r-lg:22px;
      --r-md:18px;
      --r-sm:14px;

      --safeB: env(safe-area-inset-bottom, 0px);
      --safeT: env(safe-area-inset-top, 0px);
    }

    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    body{
      margin:0;
      font-family:Montserrat,system-ui,-apple-system,Segoe UI,Roboto,Arial;
      background: radial-gradient(1200px 600px at 20% -10%, rgba(47,124,255,.20), transparent 55%),
                  radial-gradient(900px 500px at 90% 0%, rgba(255,255,255,.08), transparent 55%),
                  var(--bg);
      color:var(--text);
      padding: calc(var(--safeT) + 12px) 12px calc(var(--safeB) + 110px);
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:12px 14px;
      border:1px solid var(--stroke);
      border-radius:var(--r-lg);
      background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.05));
      backdrop-filter: blur(10px);
      position:sticky;
      top: calc(var(--safeT) + 10px);
      z-index: 20;
    }
    .brand{display:flex; flex-direction:column; gap:2px; line-height:1.05;}
    .brand b{font-size:18px;}
    .brand span{font-size:12px; color:var(--muted);}
    .top-actions{display:flex; gap:8px; align-items:center;}
    .btn{
      border:1px solid var(--stroke);
      background: rgba(255,255,255,.06);
      color:var(--text);
      border-radius:14px;
      padding:10px 12px;
      font-weight:700;
      font-size:13px;
      cursor:pointer;
    }
    .btn.primary{
      background: linear-gradient(180deg, rgba(47,124,255,.85), rgba(47,124,255,.55));
      border-color: rgba(47,124,255,.65);
    }

    .layout{
      display:grid;
      grid-template-columns: 140px 1fr;
      gap:12px;
      margin-top:12px;
    }

    .cats{
      border:1px solid var(--stroke);
      background: rgba(255,255,255,.04);
      border-radius:var(--r-lg);
      padding:10px;
      position:sticky;
      top: calc(var(--safeT) + 86px);
      height: calc(100vh - (var(--safeT) + 210px));
      overflow:auto;
    }
    .cat{
      padding:10px 10px;
      border-radius:14px;
      font-weight:800;
      font-size:13px;
      color:var(--muted);
      cursor:pointer;
      border:1px solid transparent;
    }
    .cat.active{
      color:var(--text);
      background: rgba(47,124,255,.14);
      border-color: rgba(47,124,255,.35);
    }

    .main{min-width:0;}

    .subcats{
      display:flex;
      gap:8px;
      overflow:auto;
      padding:10px;
      border:1px solid var(--stroke);
      border-radius:var(--r-lg);
      background: rgba(255,255,255,.04);
    }
    .chip{
      white-space:nowrap;
      border:1px solid var(--stroke);
      background: rgba(255,255,255,.06);
      padding:9px 12px;
      border-radius:999px;
      font-weight:800;
      font-size:12px;
      color:var(--muted);
      cursor:pointer;
    }
    .chip.active{
      color:var(--text);
      background: rgba(47,124,255,.14);
      border-color: rgba(47,124,255,.35);
    }

    .grid{
      margin-top:12px;
      display:grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap:10px;
    }
    .card{
      border:1px solid var(--stroke);
      background: rgba(255,255,255,.05);
      border-radius:var(--r-lg);
      padding:12px;
      overflow:hidden;
    }
    .title{font-weight:900; font-size:14px; line-height:1.2; margin:0 0 6px 0;}
    .meta{color:var(--muted); font-size:12px; margin-bottom:10px; line-height:1.25;}
    .row{display:flex; justify-content:space-between; align-items:center; gap:10px;}
    .price{font-weight:900; font-size:14px;}
    .add{
      padding:9px 10px;
      border-radius:14px;
      border:1px solid rgba(47,124,255,.55);
      background: rgba(47,124,255,.14);
      color:var(--text);
      font-weight:900;
      cursor:pointer;
      font-size:12px;
    }

    .bottom{
      position:fixed;
      left:0; right:0;
      bottom:0;
      padding: 12px 12px calc(var(--safeB) + 12px);
      background: linear-gradient(180deg, rgba(11,11,12,0), rgba(11,11,12,.90) 45%, rgba(11,11,12,.95));
      z-index:30;
    }

    /* drawer */
    .drawer{
      position:fixed;
      left:0; right:0;
      bottom:-100%;
      height: 78vh;
      background: rgba(20,20,22,.96);
      border-top:1px solid var(--stroke);
      border-radius: 22px 22px 0 0;
      padding:12px;
      transition: bottom .25s ease;
      z-index:40;
      overflow:auto;
    }
    .drawer.open{bottom:0;}
    .drawer .head{
      display:flex; align-items:center; justify-content:space-between;
      gap:10px;
      padding:6px 6px 10px;
    }
    .drawer .head b{font-size:16px;}
    .x{
      width:40px; height:40px;
      border-radius:14px;
      border:1px solid var(--stroke);
      background: rgba(255,255,255,.06);
      color:var(--text);
      font-weight:900;
      cursor:pointer;
    }
    .line{
      border:1px solid var(--stroke);
      background: rgba(255,255,255,.04);
      border-radius:16px;
      padding:10px;
      display:flex; justify-content:space-between; gap:10px; align-items:center;
      margin-bottom:10px;
    }
    .qty{display:flex; gap:6px; align-items:center;}
    .qbtn{
      width:34px;height:34px;border-radius:12px;
      border:1px solid var(--stroke);
      background: rgba(255,255,255,.06);
      color:var(--text);
      font-weight:900; cursor:pointer;
    }
    .total{
      display:flex; justify-content:space-between; align-items:center;
      padding:12px;
      border:1px solid var(--stroke);
      border-radius:18px;
      background: rgba(255,255,255,.06);
      font-weight:900;
    }

    /* modal */
    .overlay{
      position:fixed; inset:0;
      background: rgba(0,0,0,.55);
      display:none;
      z-index:60;
      align-items:flex-end;
      justify-content:center;
      padding:12px 12px calc(var(--safeB) + 12px);
    }
    .overlay.show{display:flex;}
    .sheet{
      width:100%;
      max-width:640px;
      border:1px solid var(--stroke);
      background: rgba(20,20,22,.98);
      border-radius:22px;
      padding:12px;
    }
    .sheet .h{
      display:flex; justify-content:space-between; align-items:center;
      margin-bottom:10px;
    }
    .sheet .h b{font-size:16px;}
    .field{
      border:1px solid var(--stroke);
      background: rgba(255,255,255,.06);
      border-radius:16px;
      padding:12px;
      color:var(--text);
      width:100%;
      font-weight:700;
      outline:none;
      font-size:13px;
    }
    textarea.field{min-height:120px; resize:none;}
    .two{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:10px;
      margin-top:10px;
    }
    .payrow{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
    .pay{
      padding:10px 12px;
      border-radius:999px;
      border:1px solid var(--stroke);
      background: rgba(255,255,255,.06);
      color:var(--muted);
      font-weight:900;
      cursor:pointer;
      font-size:12px;
    }
    .pay.active{
      color:var(--text);
      border-color: rgba(47,124,255,.45);
      background: rgba(47,124,255,.14);
    }
    .send{
      margin-top:12px;
      width:100%;
      border-radius:18px;
      padding:12px 14px;
      font-weight:900;
      border:1px solid rgba(47,124,255,.65);
      background: linear-gradient(180deg, rgba(47,124,255,.90), rgba(47,124,255,.55));
      cursor:pointer;
      color:var(--text);
    }
    .note{margin-top:10px; color:var(--muted); font-size:12px; line-height:1.3;}
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <b>Sebtech</b>
      <span>Apple Store • WebApp</span>
    </div>
    <div class="top-actions">
      <button class="btn" id="btnConsult">Консультация</button>
      <button class="btn primary" id="btnOpenCart">Корзина</button>
    </div>
  </div>

  <div class="layout">
    <div class="cats" id="cats"></div>

    <div class="main">
      <div class="subcats" id="subcats"></div>
      <div class="grid" id="grid"></div>
    </div>
  </div>

  <!-- CART DRAWER -->
  <div class="drawer" id="drawer">
    <div class="head">
      <b>Корзина</b>
      <button class="x" id="btnCloseCart">✕</button>
    </div>
    <div id="cartLines"></div>
    <div class="total">
      <span>Итого</span>
      <span id="totalSum">0 сум</span>
    </div>
    <button class="send" id="btnCheckout">Оформить заказ</button>
    <div class="note">Телефон не запрашиваем. Можно указать комментарий и адрес при доставке.</div>
  </div>

  <!-- CHECKOUT MODAL -->
  <div class="overlay" id="overlayCheckout">
    <div class="sheet">
      <div class="h">
        <b>Оформление заказа</b>
        <button class="x" id="btnCloseCheckout">✕</button>
      </div>

      <div class="two">
        <select class="field" id="orderType">
          <option value="Самовывоз">Самовывоз</option>
          <option value="Доставка">Доставка</option>
        </select>
        <input class="field" id="address" placeholder="Адрес (если доставка)" />
      </div>

      <div class="two">
        <input class="field" id="orderId" placeholder="ID заказа (авто)" disabled />
        <div></div>
      </div>

      <div class="payrow" id="payrow">
        <button class="pay active" data-pay="Наличные">Наличные</button>
        <button class="pay" data-pay="Карта">Карта</button>
        <button class="pay" data-pay="Click/Payme">Click/Payme</button>
      </div>

      <textarea class="field" id="comment" placeholder="Комментарий к заказу (необязательно)"></textarea>

      <button class="send" id="btnSendOrder">Отправить заказ</button>
      <div class="note">Заказ отправится админу. В ответ придёт подтверждение.</div>
    </div>
  </div>

  <!-- CONSULT MODAL -->
  <div class="overlay" id="overlayConsult">
    <div class="sheet">
      <div class="h">
        <b>Запрос консультации</b>
        <button class="x" id="btnCloseConsult">✕</button>
      </div>
      <textarea class="field" id="consultText" placeholder="Напишите, что вас интересует (модель, память, цвет, цена, наличие)…"></textarea>
      <button class="send" id="btnSendConsult">Отправить</button>
      <div class="note">Админу уйдёт ваш текст + ваш ник Telegram.</div>
    </div>
  </div>

<script>
  const tg = window.Telegram?.WebApp;
  try { tg?.ready(); tg?.expand(); } catch(e){}

  // ====== КАТЕГОРИИ + ПОДКАТЕГОРИИ (как вы просили) ======
  const CATEGORIES = [
    {
      key: "iphone",
      name: "iPhone",
      subs: ["Iphone 17","Iphone 16","Iphone 15","Iphone 14","Iphone 13","Iphone 12","Iphone 11","Остальные модели"]
    },
    {
      key: "accessories",
      name: "Аксессуары",
      subs: ["Чехлы для телефона","Защитные стекла","Зарядное устройство","MagSafe","Кабели USB","Ремешки для Apple Watch","Трекеры AirTag"]
    },
    {
      key: "mac",
      name: "Mac",
      subs: ["MacBook Air 13 (М4)","MacBook Air 15 (М4)","MacBook Air (М3)","MacBook Air (М2)","MacBook Air (М1)","MacBook Pro (М4)","MacBook Pro (М3)"]
    },
    {
      key: "ipad",
      name: "iPad",
      subs: ["iPad Pro (М5)","iPad Pro (М4)","iPad Air (М3)","iPad Air (М2)","iPad mini"]
    },
    {
      key: "watch",
      name: "Watch",
      subs: ["Series Ultra 3","Series Ultra 2","Series 11","Series SE 3","Series SE 2","Series 10","Series 9","Series 7"]
    },
    {
      key: "airpods",
      name: "AirPods",
      subs: ["AirPods Max","AirPods 4","AirPods 3","AirPods 2 Pro"]
    }
  ];

  // ====== ПРОДУКТЫ (пример, заполните ценами/моделями) ======
  const PRODUCTS = [
    { id:"ip16-128", category:"iphone", subcategory:"Iphone 16", name:"iPhone 16 128GB", desc:"Новый / гарантия", price: 0 },
    { id:"ip15-256", category:"iphone", subcategory:"Iphone 15", name:"iPhone 15 256GB", desc:"Новый / гарантия", price: 0 },

    { id:"case-1", category:"accessories", subcategory:"Чехлы для телефона", name:"Силиконовый чехол", desc:"Разные модели", price: 0 },
    { id:"glass-1", category:"accessories", subcategory:"Защитные стекла", name:"Защитное стекло", desc:"Установка по желанию", price: 0 },

    { id:"mba13m4", category:"mac", subcategory:"MacBook Air 13 (М4)", name:"MacBook Air 13 (M4)", desc:"Новый / гарантия", price: 0 },
    { id:"ipadprom4", category:"ipad", subcategory:"iPad Pro (М4)", name:"iPad Pro (M4)", desc:"Новый / гарантия", price: 0 },
    { id:"ultra2", category:"watch", subcategory:"Series Ultra 2", name:"Apple Watch Ultra 2", desc:"Новый / гарантия", price: 0 },
    { id:"ap2pro", category:"airpods", subcategory:"AirPods 2 Pro", name:"AirPods Pro (2)", desc:"Оригинал", price: 0 },
  ];

  // ====== STATE ======
  let activeCat = CATEGORIES[0].key;
  let activeSub = CATEGORIES[0].subs[0];
  const cart = new Map(); // id -> qty

  // ====== HELPERS ======
  const fmtSum = (n) => (Number(n||0)).toLocaleString("ru-RU").replaceAll(",", " ") + " сум";
  const getCat = (key) => CATEGORIES.find(c => c.key === key);

  // ====== RENDER CATEGORIES ======
  const catsEl = document.getElementById("cats");
  const subsEl = document.getElementById("subcats");
  const gridEl = document.getElementById("grid");

  function renderCats(){
    catsEl.innerHTML = "";
    CATEGORIES.forEach(c => {
      const div = document.createElement("div");
      div.className = "cat" + (c.key === activeCat ? " active" : "");
      div.textContent = c.name;
      div.onclick = () => {
        activeCat = c.key;
        activeSub = getCat(activeCat).subs[0];
        renderCats();
        renderSubs();
        renderProducts();
      };
      catsEl.appendChild(div);
    });
  }

  function renderSubs(){
    subsEl.innerHTML = "";
    const cat = getCat(activeCat);
    cat.subs.forEach(s => {
      const b = document.createElement("button");
      b.className = "chip" + (s === activeSub ? " active" : "");
      b.textContent = s;
      b.onclick = () => {
        activeSub = s;
        renderSubs();
        renderProducts();
      };
      subsEl.appendChild(b);
    });
  }

  function renderProducts(){
    gridEl.innerHTML = "";
    const list = PRODUCTS.filter(p => p.category === activeCat && p.subcategory === activeSub);
    if (!list.length){
      const empty = document.createElement("div");
      empty.className = "card";
      empty.style.gridColumn = "1 / -1";
      empty.innerHTML = `<div class="title">Пока нет товаров</div><div class="meta">Добавьте товары в эту подкатегорию в коде (PRODUCTS).</div>`;
      gridEl.appendChild(empty);
      return;
    }

    list.forEach(p => {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="title">${p.name}</div>
        <div class="meta">${p.desc || ""}</div>
        <div class="row">
          <div class="price">${fmtSum(p.price)}</div>
          <button class="add">Добавить</button>
        </div>
      `;
      card.querySelector(".add").onclick = () => addToCart(p.id);
      gridEl.appendChild(card);
    });
  }

  // ====== CART ======
  const drawer = document.getElementById("drawer");
  const cartLines = document.getElementById("cartLines");
  const totalSumEl = document.getElementById("totalSum");

  function addToCart(id){
    cart.set(id, (cart.get(id)||0) + 1);
    renderCart();
  }
  function decFromCart(id){
    const q = (cart.get(id)||0) - 1;
    if (q <= 0) cart.delete(id);
    else cart.set(id, q);
    renderCart();
  }
  function cartTotal(){
    let sum = 0;
    cart.forEach((qty,id)=>{
      const p = PRODUCTS.find(x=>x.id===id);
      sum += (p?.price||0) * qty;
    });
    return sum;
  }
  function renderCart(){
    cartLines.innerHTML = "";
    if (cart.size === 0){
      cartLines.innerHTML = `<div class="card">⚠️ Корзина пустая</div>`;
      totalSumEl.textContent = fmtSum(0);
      return;
    }

    cart.forEach((qty,id)=>{
      const p = PRODUCTS.find(x=>x.id===id);
      const line = document.createElement("div");
      line.className = "line";
      line.innerHTML = `
        <div style="min-width:0">
          <div style="font-weight:900; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${p?.name||id}</div>
          <div style="color:var(--muted); font-weight:800; font-size:12px">${fmtSum((p?.price||0) * qty)}</div>
        </div>
        <div class="qty">
          <button class="qbtn">−</button>
          <div style="min-width:18px; text-align:center; font-weight:900">${qty}</div>
          <button class="qbtn">+</button>
        </div>
      `;
      const [minus, plus] = line.querySelectorAll(".qbtn");
      minus.onclick = ()=>decFromCart(id);
      plus.onclick = ()=>addToCart(id);
      cartLines.appendChild(line);
    });

    totalSumEl.textContent = fmtSum(cartTotal());
  }

  // ====== OPEN/CLOSE CART ======
  document.getElementById("btnOpenCart").onclick = () => { drawer.classList.add("open"); renderCart(); };
  document.getElementById("btnCloseCart").onclick = () => drawer.classList.remove("open");

  // ====== CHECKOUT ======
  const overlayCheckout = document.getElementById("overlayCheckout");
  const btnCheckout = document.getElementById("btnCheckout");
  const btnCloseCheckout = document.getElementById("btnCloseCheckout");
  const btnSendOrder = document.getElementById("btnSendOrder");

  const orderTypeEl = document.getElementById("orderType");
  const addressEl = document.getElementById("address");
  const orderIdEl = document.getElementById("orderId");
  const commentEl = document.getElementById("comment");

  let payment = "Наличные";
  document.getElementById("payrow").addEventListener("click", (e)=>{
    const btn = e.target.closest(".pay");
    if (!btn) return;
    payment = btn.dataset.pay;
    document.querySelectorAll(".pay").forEach(x=>x.classList.remove("active"));
    btn.classList.add("active");
  });

  function genOrderId(){
    return "SB-" + Date.now().toString().slice(-8);
  }

  btnCheckout.onclick = () => {
    if (cart.size === 0) {
      alert("Корзина пустая");
      return;
    }
    orderIdEl.value = genOrderId();
    overlayCheckout.classList.add("show");
  };
  btnCloseCheckout.onclick = () => overlayCheckout.classList.remove("show");
  overlayCheckout.addEventListener("click", (e)=>{ if (e.target === overlayCheckout) overlayCheckout.classList.remove("show"); });

  btnSendOrder.onclick = () => {
    if (cart.size === 0) {
      alert("Корзина пустая");
      return;
    }

    const items = [];
    cart.forEach((qty,id)=>{
      const p = PRODUCTS.find(x=>x.id===id);
      items.push({
        id,
        name: p?.name || id,
        qty,
        price: p?.price || 0
      });
    });

    const payload = {
      action: "order",
      order_id: orderIdEl.value || genOrderId(),
      items,
      total: cartTotal(),
      type: orderTypeEl.value || "—",
      address: (addressEl.value||"").trim() || "—",
      payment,
      comment: (commentEl.value||"").trim()
    };

    try{
      tg?.sendData(JSON.stringify(payload));
      tg?.showAlert("✅ Заказ отправлен!");
    }catch(e){
      alert("Не удалось отправить. Откройте через Telegram WebApp.");
    }

    cart.clear();
    renderCart();
    overlayCheckout.classList.remove("show");
    drawer.classList.remove("open");
    addressEl.value = "";
    commentEl.value = "";
  };

  // ====== CONSULT ======
  const overlayConsult = document.getElementById("overlayConsult");
  const btnConsult = document.getElementById("btnConsult");
  const btnCloseConsult = document.getElementById("btnCloseConsult");
  const btnSendConsult = document.getElementById("btnSendConsult");
  const consultText = document.getElementById("consultText");

  btnConsult.onclick = () => overlayConsult.classList.add("show");
  btnCloseConsult.onclick = () => overlayConsult.classList.remove("show");
  overlayConsult.addEventListener("click", (e)=>{ if (e.target === overlayConsult) overlayConsult.classList.remove("show"); });

  btnSendConsult.onclick = () => {
    const text = (consultText.value || "").trim();
    if (!text) {
      alert("Напишите текст обращения");
      return;
    }
    const payload = { action: "consultation", text };
    try{
      tg?.sendData(JSON.stringify(payload));
      tg?.showAlert("✅ Отправлено! Мы скоро ответим.");
      consultText.value = "";
      overlayConsult.classList.remove("show");
    }catch(e){
      alert("Не удалось отправить. Откройте через Telegram WebApp.");
    }
  };

  // init
  renderCats();
  renderSubs();
  renderProducts();
  renderCart();
</script>
</body>
</html>
